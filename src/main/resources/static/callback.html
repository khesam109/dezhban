<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dezhban authorization callback</title>
</head>
<body>
<main>
    <h1>Authorization response</h1>
    <p>Copy the authorization code into the example script.</p>
    <pre id="response"></pre>
</main>
<script>
    const parameters = new URLSearchParams(window.location.search);
    const code = parameters.get("code");
    const state = parameters.get("state");
    const error = parameters.get("error");
    document.getElementById("response").textContent = error
        ? `error: ${error}\nstate: ${state ?? "<missing>"}`
        : code
            ? `code: ${code}\nstate: ${state ?? "<missing>"}`
            : "No response parameter received.";
</script>
</body>
</html>
